name: navi-tools-assets-production

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Standard}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?configure MSSQL_SA_PASSWORD}
    volumes:
      - navi_sqlserver_data:/var/opt/mssql
      - navi_database_backups:/var/opt/mssql/backups
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?configure MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?configure MINIO_ROOT_PASSWORD}
    volumes:
      - navi_minio_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: src/Navi.ToolsAssets.Api/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NaviToolsAssetsDb: Server=sqlserver,1433;Database=NaviToolsAssetsDb;User Id=${NAVI_SQL_USER:?configure NAVI_SQL_USER};Password=${NAVI_SQL_PASSWORD:?configure NAVI_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__NaviMasterDb: Server=sqlserver,1433;Database=NaviMasterDb;User Id=${NAVI_SQL_USER:?configure NAVI_SQL_USER};Password=${NAVI_SQL_PASSWORD:?configure NAVI_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__SigningKey: ${NAVI_JWT_SIGNING_KEY:?configure NAVI_JWT_SIGNING_KEY}
      Jwt__Issuer: ${NAVI_JWT_ISSUER:-Navi.ToolsAssets.Api}
      Jwt__Audience: ${NAVI_JWT_AUDIENCE:-Navi.ToolsAssets.Clients}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${NAVI_MINIO_ACCESS_KEY:?configure NAVI_MINIO_ACCESS_KEY}
      Minio__SecretKey: ${NAVI_MINIO_SECRET_KEY:?configure NAVI_MINIO_SECRET_KEY}
      Minio__BucketName: navi-tools-documents
      Minio__UseSsl: "false"
      Cors__AllowedOrigins__0: ${ADMIN_PUBLIC_URL:?configure ADMIN_PUBLIC_URL}
      Cors__AllowedOrigins__1: ${MOBILE_PUBLIC_URL:?configure MOBILE_PUBLIC_URL}
      Tenancy__Enabled: ${TENANCY_ENABLED:-false}
    ports:
      - "5218:8080"
    volumes:
      - navi_api_data_protection:/home/app/.aspnet/DataProtection-Keys
      - navi_database_backups:/app/storage/database-backups
    networks:
      - frontend
      - data
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: src/Navi.ToolsAssets.Admin/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      NaviApi__BaseUrl: http://api:8080/
    ports:
      - "5264:8080"
    volumes:
      - navi_admin_data_protection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  mobile:
    build:
      context: ..
      dockerfile: src/Navi.ToolsAssets.MobilePwa/Dockerfile
      args:
        NAVI_API_BASE_URL: ${PUBLIC_API_BASE_URL:?configure PUBLIC_API_BASE_URL}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "5285:8080"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: src/Navi.ToolsAssets.Worker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__NaviToolsAssetsDb: Server=sqlserver,1433;Database=NaviToolsAssetsDb;User Id=${NAVI_SQL_USER:?configure NAVI_SQL_USER};Password=${NAVI_SQL_PASSWORD:?configure NAVI_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
    networks:
      - data
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  navi_sqlserver_data:
  navi_minio_data:
  navi_database_backups:
  navi_api_data_protection:
  navi_admin_data_protection:

networks:
  frontend:
  data:
    internal: true
